        { marketId: 4, crop: 'Banana (Latondan)', price: 44, change: 1.5, volume: '310 kg' }, { marketId: 4, crop: 'Gabi (Galyang)', price: 47, change: 2.8, volume: '210 kg' }, { marketId: 4, crop: 'Ampalaya', price: 58, change: 1.9, volume: '170 kg' }, { marketId: 4, crop: 'Ube (Bariang)', price: 61, change: 3.6, volume: '140 kg' }, { marketId: 4, crop: 'Saging (Saba)', price: 36, change: 2.4, volume: '390 kg' }, { marketId: 4, crop: 'Sitaw', price: 57, change: 3.1, volume: '160 kg' }, { marketId: 4, crop: 'Palay', price: 25, change: 1.2, volume: '690 kg' }, { marketId: 4, crop: 'Luya', price: 119, change: 5.8, volume: '100 kg' }, { marketId: 4, crop: 'Turmeric', price: 79, change: 3.2, volume: '110 kg' }, { marketId: 4, crop: 'Mais', price: 28, change: 1.3, volume: '650 kg' }, { marketId: 4, crop: 'Patani', price: 69, change: 2.6, volume: '120 kg' }, { marketId: 4, crop: 'Bataw', price: 60, change: 2.9, volume: '100 kg' }, { marketId: 4, crop: 'Sigarilyas', price: 65, change: 3.8, volume: '90 kg' },

      ], calculator: { crop: 'Palay', area: 1.5, harvest: 6300, production: 42000, transportation: 6500, margin: 18, loss: 5 }, toast: '' };
      const cropYieldPerHectare = { 'Banana (Latondan)': 6800, Gabi: 10500, 'Gabi (Galyang)': 9800, Ampalaya: 7200, Ube: 8400, Talong: 8500, Mani: 2800, Patola: 7600, 'Ube (Bariang)': 7900, 'Saging (Saba)': 7200, Sitaw: 6500, Palay: 4200, Luya: 14000, Papaya: 11500, Turmeric: 12000, Mais: 3600, Okra: 6800, Kamote: 10800, Patani: 3200, Bataw: 3500, Sigarilyas: 5900 };
      document.body.classList.toggle('mobile-entry', new URLSearchParams(window.location.search).has('mobile'));
      const root = document.getElementById('root');
      const peso = (value) => `₱${Number(value || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
      const marketById = (id) => state.markets.find((market) => market.id === Number(id));
      const activeMarkets = () => state.markets.filter((market) => market.active);
      const priceRows = () => state.prices.filter((row) => { const market = marketById(row.marketId); return market && market.active && (state.crop === 'All crops' || row.crop === state.crop) && (state.district === 'All communities' || market.community === state.district); });
      const averagePrice = (crop) => { const rows = state.prices.filter((row) => row.crop === crop && marketById(row.marketId)?.active); return rows.length ? rows.reduce((sum, row) => sum + row.price, 0) / rows.length : 0; };

      function chartMarkup() { const selected = state.crop === 'All crops' ? crops.slice(1) : [state.crop]; const values = months.map((_, index) => Math.round(selected.reduce((sum, crop) => sum + cropTrend[crop][index], 0) / selected.length)); return lineChartMarkup(months, values); }
      let overviewVolumeSlide = 0;
      let overviewPriceSlide = 0;
      let overviewTrendSlide = 0;
      let overviewTrendPeriod = 'monthly';
      const overviewTrendCrops = [...crops.slice(1), 'All crops'];
      function cropVolume(crop) { return state.prices.filter((row) => row.crop === crop).reduce((sum, row) => sum + Number(row.volume.replace(/[^0-9.]/g, '')), 0); }
      function overviewTrendSeries(crop) {
        const monthlyValues = crop === 'All crops' ? months.map((_, index) => Math.round(crops.slice(1).reduce((sum, item) => sum + cropTrend[item][index], 0) / (crops.length - 1))) : cropTrend[crop];
        if (overviewTrendPeriod === 'monthly') return { labels: months, values: monthlyValues, note: 'Representative monthly sample prices.' };
        const count = overviewTrendPeriod === 'weekly' ? 8 : 7;
        const labels = overviewTrendPeriod === 'daily' ? weekdays : Array.from({ length: count }, (_, index) => `Week ${index + 1}`);
        const previous = monthlyValues[monthlyValues.length - 2];
        const latest = monthlyValues[monthlyValues.length - 1];
        const values = Array.from({ length: count }, (_, index) => Math.round(previous + (latest - previous) * (index / (count - 1))));
        return { labels, values, note: `${overviewTrendPeriod === 'weekly' ? 'Weekly' : 'Daily'} sample estimated from the locally stored monthly values.` };
      }
      function overviewTrendChart() {

        const series = overviewTrendSeries(crop);
        const periodLabel = `${overviewTrendPeriod[0].toUpperCase()}${overviewTrendPeriod.slice(1)}`;
        const markup = lineChartMarkup(series.labels, series.values).replace('aria-label="Monthly crop price line chart"', `aria-label="${periodLabel} crop price movement chart"`);

      function communitySlide() { const options = crops.slice(1); const crop = state.crop === 'All crops' ? options[((state.communitySlide % options.length) + options.length) % options.length] : state.crop; const rows = activeMarkets().filter((market) => state.district === 'All communities' || market.community === state.district).map((market) => ({ market, row: state.prices.find((price) => price.marketId === market.id && price.crop === crop) })); const values = rows.filter((item) => item.row).map((item) => item.row.price); return { crop, rows, low: values.length ? Math.min(...values) : 0, high: values.length ? Math.max(...values) : 0 }; }
      function overviewView() {

          </section>
          <section class="dashboard-grid"><article class="panel overview-trend-panel"><div class="panel-header"><div><span class="section-kicker">Porac price pulse</span><h2>${esc(trend.crop === 'All crops' ? 'Average across all crops' : `${trend.crop} price movement`)}</h2></div><span class="comparison-slide-badge">${trendIndex + 1} / ${overviewTrendCrops.length}</span></div>

            <div class="chart-meta"><strong>${peso(trend.series.values[trend.series.values.length - 1])} / kg</strong><span class="green-text">${esc(trend.crop === 'All crops' ? 'All-crop average' : trend.crop)}</span></div>${trend.markup}<div class="chart-note"><span class="note-badge">i</span> ${esc(trend.series.note)} The line cycles through each crop and the all-crop average.</div></article>
            <article class="panel comparison-panel"><div class="panel-header"><div><span class="section-kicker">Same-crop comparison</span><h2>${marketSlide.crop} local market status</h2></div><span class="comparison-slide-badge">Auto ${state.communitySlide % (crops.length - 1) + 1} / ${crops.length - 1}</span></div><div class="slide-main"><div><strong>${peso(marketSlide.low)} - ${peso(marketSlide.high)} / kg</strong><p>${marketSlide.rows.filter((item) => item.row).length} of ${marketSlide.rows.length} markets offer ${marketSlide.crop}. Difference between highest and lowest: ${peso(marketSlide.high - marketSlide.low)} / kg.</p></div></div><div class="comparison-list">${marketSlide.rows.map((item) => `<div class="comparison-row ${item.row ? '' : 'unavailable-row'}"><div class="row-label"><strong>${esc(item.market.community)}</strong><span>${item.row ? peso(item.row.price) : 'Not offered'}</span></div><div class="bar-track"><div class="bar-fill ${item.row ? 'highlight' : ''}" style="width:${item.row ? Math.max(14, item.row.price / Math.max(marketSlide.high, 1) * 100) : 0}%"></div></div><small>${item.row ? 'Available' : 'No listing'}</small></div>`).join('')}</div><div class="auto-slide-label">Rotating same-crop market comparison</div></article></section>

          ['Porac crop pricing coordinator', 'Palay and vegetable grower · Guagua'],
          ['Manage profile', 'Manage my farm'],
          ['Registered markets', 'Nearby buying points'],
          ['Profile / Admin', 'My Farm'],
          ['Operations control', 'Farmer profile'],
          ['Department of Agriculture Coordinator', 'Maria Santos'],
          ['Porac Crop Pricing DSS administrator', 'Local farmer using Porac Pricing DSS'],
          ['Overseeing local market records and farmer pricing information', 'Checking local prices and planning harvest sales'],
          ['No new administrator alerts.', 'No new local price alerts.'],
          ['Administrator workspace', 'Farmer workspace'],
          ['Manage the registered Porac market network and keep the local crop database current.', 'Review your farm details and use the Porac DSS to plan a sale.'],
          ['across registered market listings', 'across local buyer listings'],
          ['total records, including inactive', 'local buying points listed'],
        ]);

        function personalizeFarmerView() {
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          let textNode;
          while ((textNode = walker.nextNode())) {
            for (const [original, farmerText] of replacements) {
              if (textNode.nodeValue.includes(original)) textNode.nodeValue = textNode.nodeValue.replaceAll(original, farmerText);
            }
          }

          const profileLink = root.querySelector('a[href="#profile"]');
          if (profileLink) {
            profileLink.title = 'My Farm';
            profileLink.setAttribute('aria-label', 'My Farm');
          }
          root.querySelectorAll('.avatar').forEach((avatar) => { avatar.textContent = 'MS'; });

          const profileHeading = root.querySelector('.page-heading h1');
          const profilePanel = root.querySelector('.profile-panel');
          if (profileHeading?.textContent === 'My Farm' && profilePanel && !profilePanel.dataset.farmerProfile) {
            profilePanel.dataset.farmerProfile = 'true';
            profilePanel.innerHTML = `<div class="profile-overview"><div class="profile-avatar">MS</div><div class="profile-details"><strong>Maria Santos</strong><span>Palay and vegetable grower</span><small>Guagua, Pampanga</small></div><span class="calculator-status">Farmer account</span></div><div class="admin-summary"><span><strong>Palay</strong> main crop</span><span><strong>Vegetables</strong> secondary crops</span><span><strong>Pampanga</strong> local market area</span></div><p class="profile-intro">Use your local market prices, crop trends, and pricing calculator to plan a harvest sale. Profile details shown here are sample information for this local DSS.</p><div class="profile-tools"><article class="profile-tool"><span class="tool-icon">₱</span><div><strong>Check local prices</strong><small>Compare buying points and recent crop prices.</small></div><a class="link-button" href="#markets">Markets &amp; Trends →</a></article><article class="profile-tool"><span class="tool-icon">=</span><div><strong>Plan a selling price</strong><small>Estimate costs, break-even, and target price.</small></div><a class="link-button" href="#calculator">Open calculator →</a></article></div>`;
          }
        }

        const observer = new MutationObserver(() => {
          observer.disconnect();
          personalizeFarmerView();
          observer.observe(root, { characterData: true, childList: true, subtree: true });
        });
        personalizeFarmerView();
        observer.observe(root, { characterData: true, childList: true, subtree: true });
      }
    </script>
    <script>
      const dashboardRoot = document.getElementById('root');
      const longDate = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date());
      const shortDate = new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).format(new Date());
      const dashboardReplacements = new Map([
        ['Porac Pricing DSS', 'IS78 Pricing DSS'],
        ['Porac decision support', 'Pricing decision support'],
        ['Markets & Trends', 'Markets'],
        ['Profile / Admin', 'Profile'],
        ['Porac price pulse', 'Market price movement'],
        ['Porac, Pampanga | 22 September 2026', `Porac, Pampanga | ${longDate}`],
        ['Porac, Pampanga | Last updated 22 Sep 2026', `Porac, Pampanga | Last updated ${shortDate}`],
        ['DSS / ', 'IS78 / '],
      ]);

      function addCalculatorClearControl() {
        const calculatorHeader = dashboardRoot.querySelector('.calculator-panel .panel-header');
        if (!calculatorHeader || calculatorHeader.querySelector('[data-action="clear-calculator"]')) return;

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'clear-button';
        button.dataset.action = 'clear-calculator';
        button.textContent = 'Clear inputs';
        calculatorHeader.append(button);

        const cropSelect = dashboardRoot.querySelector('select[data-calc="crop"]');
        if (cropSelect && !cropSelect.querySelector('option[value=""]')) {
          const placeholder = document.createElement('option');
          placeholder.value = '';
          placeholder.textContent = 'Select crop';
          cropSelect.prepend(placeholder);
        }
        if (cropSelect) cropSelect.value = state.calculator.crop || '';
      }

      function updateDashboardLabels() {
        const walker = document.createTreeWalker(dashboardRoot, NodeFilter.SHOW_TEXT);
        let textNode;
        while ((textNode = walker.nextNode())) {
          for (const [original, updated] of dashboardReplacements) {
            if (textNode.nodeValue.includes(original)) textNode.nodeValue = textNode.nodeValue.replaceAll(original, updated);
          }
        }

        const pageSubheading = dashboardRoot.querySelector('.page-heading .subheading');
        if (pageSubheading && new URLSearchParams(window.location.search).get('farmer') !== '1') {
          const activeMarketIds = new Set(state.markets.filter((market) => market.active).map((market) => market.id));
          const listedCropCount = new Set(state.prices.filter((price) => activeMarketIds.has(price.marketId)).map((price) => price.crop)).size;
          if (state.tab === 'overview') {
            pageSubheading.textContent = `You have ${activeMarketIds.size} active market${activeMarketIds.size === 1 ? '' : 's'} and ${listedCropCount} crop type${listedCropCount === 1 ? '' : 's'} with listed prices.`;
          } else if (state.tab === 'markets') {
            const rows = priceRows();
            const marketCount = new Set(rows.map((row) => row.marketId)).size;
            pageSubheading.textContent = rows.length
              ? `${rows.length} price listings across ${marketCount} active market${marketCount === 1 ? '' : 's'}.`
              : 'No price listings match the selected filters.';
          } else if (state.tab === 'calculator') {
            pageSubheading.textContent = `Market averages are available across ${listedCropCount} crop types.`;
          } else if (state.tab === 'profile') {
            pageSubheading.textContent = `${activeMarketIds.size} of ${state.markets.length} registered markets are active; ${listedCropCount} crop types are listed.`;
          }
        }

        dashboardRoot.querySelector('.brand-mark')?.replaceChildren('I');
        const breadcrumbTitle = dashboardRoot.querySelector('.breadcrumb strong');
        if (breadcrumbTitle) breadcrumbTitle.textContent = 'IS78 crop pricing';
        dashboardRoot.querySelectorAll('.nav-item').forEach((item) => {
          const label = item.textContent.trim();
          item.setAttribute('aria-label', label);
          item.title = label;
        });
        addCalculatorClearControl();
        dashboardRoot.querySelector('.calculator-panel .panel-header .muted-label')?.remove();
        document.title = document.title.replace('Porac Pricing DSS', 'IS78 Pricing DSS');
      }

      dashboardRoot.addEventListener('click', (event) => {
        if (!event.target.closest('[data-action="clear-calculator"]')) return;
        state.calculator = { crop: '', area: '', harvest: '', production: '', transportation: '', margin: '', loss: '' };
        render();
      });

      const renderDashboard = render;
      render = function () {
        renderDashboard();
        updateDashboardLabels();
      };
      updateDashboardLabels();
    </script>
  </body>
</html>
